[workspace]
members = ["mini_udp", "derive"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["faervan <faervan@proton.me>"]

[workspace.dependencies]
mini_udp_derive.path = "derive"

crc = "3.4"
rand = "0.10"
ringbuffer = { version = "0.16", default-features = false }
byteable = "0.32"

thiserror = "2"
enum-assoc = "1.3"

# Proc macro libs
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits"] }
